name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare pubspec (fix name)
        run: |
          if grep -q "name: COREAI" pubspec.yaml; then
            sed -i 's/name: COREAI/name: coreai/' pubspec.yaml
          fi
          flutter pub get

      - name: Regenerate Android platform
        run: |
          rm -rf android/
          flutter create --project-name coreai --platforms=android .
          echo "✅ Android platform regenerated"

      - name: Add permissions to AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Supprime toute ligne </manifest> existante
          sed -i '/<\/manifest>/d' "$MANIFEST"
          # Ajoute les permissions
          echo "    <uses-permission android:name=\"android.permission.CAMERA\"/>" >> "$MANIFEST"
          echo "    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>" >> "$MANIFEST"
          echo "    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>" >> "$MANIFEST"
          echo "</manifest>" >> "$MANIFEST"
          echo "✅ Permissions added"

      - name: Build APK release
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreai-release
          path: build/app/outputs/flutter-apk/app-release.apk
