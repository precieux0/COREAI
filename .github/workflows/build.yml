name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # ---------------- RÉGÉNÉRATION COMPLÈTE D'ANDROID ----------------
      - name: Regenerate Android platform
        run: |
          # Sauvegarde les fichiers importants (comme le manifeste avec les permissions)
          mkdir -p /tmp/android_backup
          [ -f android/app/src/main/AndroidManifest.xml ] && cp android/app/src/main/AndroidManifest.xml /tmp/android_backup/
          
          # Supprime l'ancien dossier android problématique
          rm -rf android/
          
          # Recrée une plateforme Android propre
          flutter create --platforms=android .
          
          # Réapplique les permissions nécessaires depuis la sauvegarde
          if [ -f /tmp/android_backup/AndroidManifest.xml ]; then
            # Extrait les permissions du fichier sauvegardé
            PERMS=$(grep -o '<uses-permission[^>]*/>' /tmp/android_backup/AndroidManifest.xml || true)
            for perm in $PERMS; do
              if ! grep -q "$perm" android/app/src/main/AndroidManifest.xml; then
                # Insère la permission avant la balise de fermeture </manifest>
                sed -i "s|</manifest>|    $perm\n</manifest>|" android/app/src/main/AndroidManifest.xml
              fi
            done
          fi
          
          # Ajoute les permissions CAMERA et stockage manuellement si nécessaire
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n</manifest>|' android/app/src/main/AndroidManifest.xml
          
          echo "✅ Android platform regenerated successfully"
      # ----------------------------------------------------------------

      - name: Final cleanup & verification
        run: |
          # Nettoie le cache pour être sûr
          flutter clean
          flutter pub get
          
          # Vérification optionnelle des fichiers clés
          echo "=== build.gradle (app) ==="
          head -20 android/app/build.gradle
          echo "=== AndroidManifest.xml permissions ==="
          grep "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Build APK release
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreai-release
          path: build/app/outputs/flutter-apk/app-release.apk