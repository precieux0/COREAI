name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Regenerate Android platform (bypass uppercase name issue)
        run: |
          # Crée un dossier temporaire avec un nom valide (minuscules)
          TEMP_DIR=$(mktemp -d)
          echo "Travail dans $TEMP_DIR"
          
          # Copie tout le projet (sauf .git)
          rsync -av --exclude='.git' ./ "$TEMP_DIR/" > /dev/null
          
          # Se déplace dans le temporaire
          cd "$TEMP_DIR"
          
          # Recrée la plateforme Android (le nom du dossier peut être modifié temporairement)
          # On force le nom du projet dans pubspec.yaml en minuscules pour flutter create
          sed -i 's/name: COREAI/name: coreai/' pubspec.yaml 2>/dev/null || true
          flutter create --platforms=android .
          
          # Copie le dossier android généré vers le projet original
          cp -r android "$OLDPWD"/
          
          # Retour
          cd "$OLDPWD"
          
          # Nettoie
          rm -rf "$TEMP_DIR"
          
          # Rétablit le nom original dans pubspec.yaml (si besoin)
          sed -i 's/name: coreai/name: COREAI/' pubspec.yaml 2>/dev/null || true
          
          echo "✅ Android platform regenerated"

      - name: Add necessary permissions to AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Ajoute les permissions si absentes
          for perm in "android.permission.CAMERA" "android.permission.READ_EXTERNAL_STORAGE" "android.permission.WRITE_EXTERNAL_STORAGE"; do
            if ! grep -q "$perm" "$MANIFEST"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$perm\"/>\n</manifest>|" "$MANIFEST"
            fi
          done

      - name: Build APK release
        run: flutter build apk --release --target-platform android-arm64,android-x64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreai-release
          path: build/app/outputs/flutter-apk/app-release.apk
